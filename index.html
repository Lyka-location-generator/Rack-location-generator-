<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyka | Rack Label Generator</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Roboto+Condensed:wght@700;900&display=swap" rel="stylesheet">
<style id="dynamic-print-style">
  @page {
    size: portrait;
    margin: 0;
  }
</style>
<style>
  :root {
    --lyka-dark: #112218;
    --lyka-green: #1E392A;
    --lyka-accent: #2D5A40;
    --lyka-light-green: #00E676;
    --card-bg: #1A2820;
    --input-bg: #111D16;
    --text-color: #F3F7F4;
    --border-color: #2D4436;
  }

  body {
    margin: 0;
    padding: 30px 20px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: var(--lyka-dark);
    background-image: radial-gradient(circle at 50% 0%, #1c3d2a 0%, #0d1a12 100%);
    color: var(--text-color);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .app-container {
    background: var(--card-bg);
    padding: 30px 35px;
    border-radius: 20px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.05);
    max-width: 680px;
    width: 100%;
    margin-bottom: 30px;
    border: 1px solid var(--border-color);
    box-sizing: border-box;
  }

  .brand-header {
    text-align: center;
    margin-bottom: 25px;
  }

  .brand-badge {
    display: inline-block;
    background: rgba(0, 230, 118, 0.12);
    color: var(--lyka-light-green);
    font-weight: 800;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(0, 230, 118, 0.25);
    margin-bottom: 8px;
  }

  h1 {
    margin: 0;
    color: #ffffff;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .form-group {
    margin-bottom: 22px;
  }

  label {
    display: block;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: 700;
    color: #A3C2B0;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .radio-group {
    display: flex;
    gap: 15px;
  }

  .radio-card {
    flex: 1;
    background: var(--input-bg);
    border: 2px solid var(--border-color);
    padding: 14px;
    border-radius: 12px;
    cursor: pointer;
    text-align: center;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .radio-card input {
    display: none;
  }

  .radio-card.active {
    border-color: var(--lyka-light-green);
    background: rgba(0, 230, 118, 0.08);
    box-shadow: 0 0 15px rgba(0, 230, 118, 0.15);
  }

  .radio-card span {
    font-size: 16px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.5px;
  }

  .inputs-grid {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
  }

  .input-box {
    background: var(--input-bg);
    border: 1.5px solid var(--border-color);
    color: #fff;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 18px;
    font-weight: 800;
    padding: 12px;
    border-radius: 10px;
    text-transform: uppercase;
    text-align: center;
    transition: all 0.2s ease;
    box-sizing: border-box;
  }

  .input-box:focus {
    outline: none;
    border-color: var(--lyka-light-green);
    box-shadow: 0 0 0 3px rgba(0, 230, 118, 0.2);
  }

  .area-code-input, .side-id-input, .header-text-input {
    width: 100%;
  }

  .grid-col {
    flex: 1;
    min-width: 130px;
  }

  .location-id-group {
    display: flex;
    gap: 6px;
  }

  .loc-digit {
    flex: 1;
    width: 100%;
    padding: 12px 4px;
  }

  .btn-container {
    display: flex;
    gap: 12px;
    margin-top: 28px;
  }

  .btn {
    flex: 1;
    padding: 16px;
    border: none;
    border-radius: 12px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-generate {
    background-color: var(--lyka-light-green);
    color: var(--lyka-dark);
    box-shadow: 0 4px 14px rgba(0, 230, 118, 0.3);
  }

  .btn-generate:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 230, 118, 0.4);
  }

  .btn-print {
    background-color: var(--lyka-accent);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .btn-print:hover {
    background-color: #356a4b;
    transform: translateY(-2px);
  }

  #preview-stage {
    background: #ffffff;
    padding: 25px;
    border-radius: 16px;
    overflow-x: auto;
    max-width: 100%;
    display: flex;
    justify-content: center;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
  }

  /* --- PRINT STYLES --- */
  @media print {
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color-adjust: exact !important;
      box-sizing: border-box;
    }
    html, body {
      width: 100% !important;
      height: 100% !important;
      background: #fff !important;
      padding: 0 !important;
      margin: 0 !important;
      overflow: hidden !important;
    }
    .app-container {
      display: none !important;
    }
    #preview-stage {
      padding: 0 !important;
      background: none !important;
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      box-shadow: none !important;
    }

    .label-container-vertical {
      width: 2.45in !important;
      height: 8.2in !important;
      max-height: 96vh !important;
      margin: 0 auto !important;
    }

    .label-container-horizontal {
      width: 10.2in !important;
      height: 2.1in !important;
      margin: 0 auto !important;
    }
  }

  /* Label Layout Base */
  .label-container-horizontal, .label-container-vertical {
    font-family: 'Roboto Condensed', sans-serif;
  }

  /* Horizontal Layout (Back Mode) */
  .label-container-horizontal {
    width: 10.5in;
    height: 2.1in;
    background: #ffffff;
    border: 2px solid #000;
    display: flex;
    flex-direction: row;
    margin: 0 auto;
    box-sizing: border-box;
    page-break-inside: avoid;
  }

  .label-container-horizontal .level-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    flex: 1;
    height: 100%;
    border-right: 2px solid #000;
    box-sizing: border-box;
    padding: 4px 6px 0 6px; /* High quiet zone on sides */
  }

  .label-container-horizontal .barcode-wrapper {
    background: #fff;
    width: 100%;
    text-align: center;
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .label-container-horizontal .barcode-svg {
    width: 100%;
    height: auto;
    max-height: 70px;
  }

  .label-container-horizontal .text-row {
    width: calc(100% + 12px); /* Spans full width edge to edge */
    margin-left: -6px;
    margin-right: -6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2px 4px;
    border-top: 2px solid #000;
    box-sizing: border-box;
  }

  .label-container-horizontal .level-text {
    font-size: 20px;
    font-weight: 900;
    color: #000;
  }

  .label-container-horizontal .check-digit {
    background: #000;
    color: #fff;
    font-size: 16px;
    font-weight: 900;
    padding: 1px 3px;
  }

  .label-container-horizontal .location-header {
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 1.4in;
    height: 100%;
    box-sizing: border-box;
  }

  .label-container-horizontal .loc-text {
    font-size: 38px;
    font-weight: 900;
    color: #000;
  }

  /* Vertical Layout (Front Mode) */
  .label-container-vertical {
    width: 2.45in;
    height: 8.2in;
    background: #ffffff;
    border: 2px solid #000;
    display: flex;
    flex-direction: column;
    margin: 0 auto;
    box-sizing: border-box;
    page-break-inside: avoid;
  }

  .label-container-vertical .level-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    flex: 1;
    width: 100%;
    border-bottom: 2px solid #000;
    box-sizing: border-box;
    padding-top: 2px;
  }

  .label-container-vertical .barcode-wrapper {
    background: #fff;
    width: 100%;
    text-align: center;
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .label-container-vertical .barcode-svg {
    width: 98%;
    height: 52px;
  }

  .label-container-vertical .text-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2px 6px;
    border-top: 2px solid #000;
    box-sizing: border-box;
  }

  .label-container-vertical .level-text {
    font-size: 18px;
    font-weight: 900;
    color: #000;
  }

  .label-container-vertical .check-digit {
    background: #000;
    color: #fff;
    font-size: 16px;
    font-weight: 900;
    padding: 1px 3px;
  }

  .label-container-vertical .location-header {
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 0.65in;
    width: 100%;
    box-sizing: border-box;
  }

  .label-container-vertical .loc-text {
    font-size: 28px;
    font-weight: 900;
    color: #000;
  }

  .color-white { background-color: #FFFFFF !important; }
  .color-pink { background-color: #EE8CB4 !important; }
  .color-green { background-color: #5BB043 !important; }
  .color-yellow { background-color: #E5E338 !important; }
  .color-blue { background-color: #1E88E5 !important; }
</style>
</head>
<body>

<div class="app-container">
  <div class="brand-header">
    <div class="brand-badge">Lyka Warehouse Tool</div>
    <h1>Rack Label Generator</h1>
  </div>
  
  <div class="form-group">
    <label>Layout Mode</label>
    <div class="radio-group">
      <div class="radio-card active" id="card-front" onclick="selectLayout('front')">
        <input type="radio" name="layout" id="mode-front" value="front" checked>
        <span>Front</span>
      </div>
      <div class="radio-card" id="card-back" onclick="selectLayout('back')">
        <input type="radio" name="layout" id="mode-back" value="back">
        <span>Back</span>
      </div>
    </div>
  </div>

  <div class="form-group">
    <div class="inputs-grid">
      <div class="grid-col">
        <label for="area-code">Area Code</label>
        <input type="text" id="area-code" class="input-box area-code-input" value="DSCA" maxlength="6">
      </div>
      <div class="grid-col" style="flex: 1.2;">
        <label>Location ID</label>
        <div class="location-id-group">
          <input type="text" id="loc-1" class="input-box loc-digit" value="0" maxlength="1">
          <input type="text" id="loc-2" class="input-box loc-digit" value="2" maxlength="1">
          <input type="text" id="loc-3" class="input-box loc-digit" value="0" maxlength="1">
          <input type="text" id="loc-4" class="input-box loc-digit" value="0" maxlength="1">
        </div>
      </div>
      <div class="grid-col">
        <label for="side-id">Side Identifier</label>
        <input type="text" id="side-id" class="input-box side-id-input" value="AF" maxlength="4">
      </div>
    </div>
  </div>

  <div class="form-group">
    <label for="header-text">Location Header Text</label>
    <input type="text" id="header-text" class="input-box header-text-input" value="A-00" maxlength="10">
  </div>

  <div class="btn-container">
    <button class="btn btn-generate" onclick="generateLabel()">Generate Label</button>
    <button class="btn btn-print" onclick="window.print()">Print Label</button>
  </div>
</div>

<div id="preview-stage"></div>

<script>
  let selectedLayoutMode = 'front';

  function selectLayout(mode) {
    selectedLayoutMode = mode;
    document.getElementById('card-front').classList.toggle('active', mode === 'front');
    document.getElementById('card-back').classList.toggle('active', mode === 'back');
    document.getElementById(`mode-${mode}`).checked = true;

    const printStyleTag = document.getElementById('dynamic-print-style');
    if (mode === 'front') {
      printStyleTag.innerHTML = `@page { size: portrait; margin: 0; }`;
    } else {
      printStyleTag.innerHTML = `@page { size: landscape; margin: 0; }`;
    }
  }

  const locInputs = [
    document.getElementById('loc-1'),
    document.getElementById('loc-2'),
    document.getElementById('loc-3'),
    document.getElementById('loc-4')
  ];

  locInputs.forEach((input, index) => {
    input.addEventListener('input', (e) => {
      if (e.target.value.length === 1 && index < locInputs.length - 1) {
        locInputs[index + 1].focus();
      }
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
        locInputs[index - 1].focus();
      }
    });
  });

  function generateLabel() {
    const areaCode = document.getElementById('area-code').value.trim().toUpperCase();
    const locDigits = locInputs.map(i => i.value.trim().toUpperCase()).join('');
    const sideId = document.getElementById('side-id').value.trim().toUpperCase();
    const headerText = document.getElementById('header-text').value.trim().toUpperCase();

    if (!areaCode || locDigits.length < 4 || !sideId || !headerText) {
      alert("Please fill in all fields.");
      return;
    }

    const levels = [
      { code: '40', color: 'color-blue' },
      { code: '30', color: 'color-yellow' },
      { code: '20', color: 'color-green' },
      { code: '10', color: 'color-pink' },
      { code: '00', color: 'color-white' }
    ];

    const previewStage = document.getElementById('preview-stage');
    previewStage.innerHTML = '';

    const isHorizontal = selectedLayoutMode === 'back';
    const container = document.createElement('div');
    container.className = isHorizontal ? 'label-container-horizontal' : 'label-container-vertical';

    levels.forEach(lvl => {
      const block = document.createElement('div');
      block.className = 'level-block';
      block.innerHTML = `
        <div class="barcode-wrapper">
          <svg class="barcode-svg" id="barcode-${lvl.code}"></svg>
        </div>
        <div class="text-row ${lvl.color}">
          <span class="level-text">${lvl.code}-${sideId}</span>
          <span class="check-digit">00</span>
        </div>
      `;
      container.appendChild(block);
    });

    const headerBlock = document.createElement('div');
    headerBlock.className = 'location-header';
    headerBlock.innerHTML = `<div class="loc-text">${headerText}</div>`;
    container.appendChild(headerBlock);

    previewStage.appendChild(container);

    const barcodeOptions = {
      format: "CODE128",
      lineColor: "#000000",
      width: isHorizontal ? 1.4 : 1.65,
      height: isHorizontal ? 48 : 48,
      displayValue: true,
      fontSize: 10,
      fontOptions: "bold",
      font: "monospace",
      textMargin: 4,
      margin: 10 /* Ensures 10px quiet zone on left & right */
    };

    levels.forEach(lvl => {
      const fullBarcode = `${areaCode}${locDigits.slice(0, 2)}${lvl.code}${sideId}`;
      JsBarcode(`#barcode-${lvl.code}`, fullBarcode, barcodeOptions);
    });
  }

  window.onload = generateLabel;
</script>

</body>
</html>
