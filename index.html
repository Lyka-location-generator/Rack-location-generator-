<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rack Label Generator</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #12181b;
    --card-bg: #1e272c;
    --accent-color: #4CAF50;
    --text-color: #f5f5f5;
    --border-color: #37474f;
  }

  body {
    margin: 0;
    padding: 20px;
    font-family: 'Roboto Condensed', sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .app-container {
    background: var(--card-bg);
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    max-width: 800px;
    width: 100%;
    margin-bottom: 30px;
    border: 1px solid var(--border-color);
  }

  h1 {
    margin-top: 0;
    text-align: center;
    color: #ffffff;
    font-size: 28px;
    letter-spacing: 1px;
  }

  .form-group {
    margin-bottom: 20px;
  }

  label {
    display: block;
    margin-bottom: 8px;
    font-size: 16px;
    font-weight: bold;
    color: #b0bec5;
  }

  /* Layout Selection Switches */
  .radio-group {
    display: flex;
    gap: 20px;
  }

  .radio-card {
    flex: 1;
    background: #263238;
    border: 2px solid var(--border-color);
    padding: 15px;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s ease;
  }

  .radio-card input {
    display: none;
  }

  .radio-card.active {
    border-color: var(--accent-color);
    background: #1b382b;
  }

  .radio-card span {
    font-size: 18px;
    font-weight: 900;
  }

  /* Inputs Grid */
  .inputs-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
  }

  .input-box {
    background: #263238;
    border: 1px solid var(--border-color);
    color: #fff;
    font-family: inherit;
    font-size: 20px;
    font-weight: bold;
    padding: 10px;
    border-radius: 6px;
    text-transform: uppercase;
    text-align: center;
  }

  .input-box:focus {
    outline: none;
    border-color: var(--accent-color);
  }

  .area-code-input, .side-id-input {
    width: 120px;
  }

  .location-id-group {
    display: flex;
    gap: 8px;
  }

  .loc-digit {
    width: 45px;
  }

  /* Action Buttons */
  .btn-container {
    display: flex;
    gap: 15px;
    margin-top: 25px;
  }

  .btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 6px;
    font-size: 18px;
    font-weight: 900;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: opacity 0.2s ease;
  }

  .btn-generate {
    background-color: var(--accent-color);
    color: #fff;
  }

  .btn-print {
    background-color: #0288d1;
    color: #fff;
  }

  .btn:hover {
    opacity: 0.9;
  }

  /* Preview Display Stage */
  #preview-stage {
    background: #ffffff;
    padding: 20px;
    border-radius: 8px;
    overflow-x: auto;
    max-width: 100%;
  }

  /* --- PRINT STYLES --- */
  @media print {
    @page {
      size: 14in 2.5in;
      margin: 5mm;
    }
    body {
      background: #fff !important;
      padding: 0 !important;
      margin: 0 !important;
    }
    .app-container {
      display: none !important;
    }
    #preview-stage {
      padding: 0 !important;
    }
    .label-container-horizontal,
    .label-container-vertical {
      border: 2px solid #000 !important;
    }
  }

  /* Horizontal Rack Label Layout (Back Mode) */
  .label-container-horizontal {
    width: 13.6in;
    height: 2.3in;
    background: #ffffff;
    border: 2px solid #000;
    display: flex;
    flex-direction: row;
    margin: 0 auto;
    box-sizing: border-box;
  }

  .label-container-horizontal .level-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    flex: 1;
    height: 100%;
    border-right: 2px solid #000;
    min-width: 0;
    box-sizing: border-box;
  }

  .label-container-horizontal .barcode-wrapper {
    background: #fff;
    width: 100%;
    text-align: center;
    padding: 6px 4px 2px 4px;
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .label-container-horizontal .barcode-svg {
    max-width: 90%;
    height: 65px;
    display: block;
    margin: 0 auto;
  }

  .label-container-horizontal .text-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 8px;
    border-top: 2px solid #000;
    box-sizing: border-box;
  }

  .label-container-horizontal .level-text {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: -0.5px;
    line-height: 1;
    color: #000;
    white-space: nowrap;
  }

  .label-container-horizontal .check-digit {
    background: #000;
    color: #fff;
    font-size: 26px;
    font-weight: 900;
    padding: 2px 6px;
    line-height: 1;
    flex-shrink: 0;
  }

  .label-container-horizontal .location-header {
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2.0in;
    height: 100%;
    padding: 0 8px;
    flex-shrink: 0;
    box-sizing: border-box;
  }

  .label-container-horizontal .loc-text {
    font-size: 60px;
    font-weight: 900;
    margin: 0;
    line-height: 1;
    letter-spacing: -1px;
    text-align: center;
    color: #000;
  }

  /* Vertical Rack Label Layout (Front Mode) */
  .label-container-vertical {
    width: 2.5in;
    height: 13.6in;
    background: #ffffff;
    border: 2px solid #000;
    display: flex;
    flex-direction: column;
    margin: 0 auto;
    box-sizing: border-box;
  }

  .label-container-vertical .level-block {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    flex: 1;
    width: 100%;
    border-bottom: 2px solid #000;
    min-height: 0;
    box-sizing: border-box;
  }

  .label-container-vertical .barcode-wrapper {
    background: #fff;
    height: 100%;
    padding: 4px;
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .label-container-vertical .barcode-svg {
    max-height: 90%;
    width: 120px;
    display: block;
  }

  .label-container-vertical .text-row {
    height: 100%;
    width: 100px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 6px 4px;
    border-left: 2px solid #000;
    box-sizing: border-box;
  }

  .label-container-vertical .level-text {
    font-size: 28px;
    font-weight: 900;
    line-height: 1;
    color: #000;
  }

  .label-container-vertical .check-digit {
    background: #000;
    color: #fff;
    font-size: 22px;
    font-weight: 900;
    padding: 2px 4px;
    line-height: 1;
  }

  .label-container-vertical .location-header {
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 1.5in;
    width: 100%;
    box-sizing: border-box;
  }

  .label-container-vertical .loc-text {
    font-size: 48px;
    font-weight: 900;
    color: #000;
  }

  /* Color Schemes */
  .color-white { background-color: #FFFFFF !important; }
  .color-pink { background-color: #EE8CB4 !important; }
  .color-green { background-color: #5BB043 !important; }
  .color-yellow { background-color: #E5E338 !important; }
  .color-blue { background-color: #1E88E5 !important; }
</style>
</head>
<body>

<div class="app-container">
  <h1>Rack Label Generator</h1>
  
  <!-- Layout Selection -->
  <div class="form-group">
    <label>Layout Mode</label>
    <div class="radio-group">
      <div class="radio-card" id="card-front" onclick="selectLayout('front')">
        <input type="radio" name="layout" id="mode-front" value="front">
        <span>Front</span>
      </div>
      <div class="radio-card active" id="card-back" onclick="selectLayout('back')">
        <input type="radio" name="layout" id="mode-back" value="back" checked>
        <span>Back</span>
      </div>
    </div>
  </div>

  <div class="form-group">
    <div class="inputs-grid">
      <!-- Area Code -->
      <div>
        <label for="area-code">Area Code</label>
        <input type="text" id="area-code" class="input-box area-code-input" value="DSCA" maxlength="6" placeholder="DSC">
      </div>

      <!-- Location ID Segmented -->
      <div>
        <label>Location ID</label>
        <div class="location-id-group">
          <input type="text" id="loc-1" class="input-box loc-digit" value="0" maxlength="1">
          <input type="text" id="loc-2" class="input-box loc-digit" value="2" maxlength="1">
          <input type="text" id="loc-3" class="input-box loc-digit" value="0" maxlength="1">
          <input type="text" id="loc-4" class="input-box loc-digit" value="0" maxlength="1">
        </div>
      </div>

      <!-- Side Identifiers -->
      <div>
        <label for="side-id">Side Identifier</label>
        <input type="text" id="side-id" class="input-box side-id-input" value="AF" maxlength="4" placeholder="AF">
      </div>
    </div>
  </div>

  <div class="btn-container">
    <button class="btn btn-generate" onclick="generateLabel()">GO</button>
    <button class="btn btn-print" onclick="window.print()">Print Label</button>
  </div>
</div>

<!-- Preview Render Stage -->
<div id="preview-stage"></div>

<script>
  let selectedLayoutMode = 'back';

  function selectLayout(mode) {
    selectedLayoutMode = mode;
    document.getElementById('card-front').classList.toggle('active', mode === 'front');
    document.getElementById('card-back').classList.toggle('active', mode === 'back');
    document.getElementById(`mode-${mode}`).checked = true;
  }

  // Auto-tab behavior for Location ID digits
  const locInputs = [
    document.getElementById('loc-1'),
    document.getElementById('loc-2'),
    document.getElementById('loc-3'),
    document.getElementById('loc-4')
  ];

  locInputs.forEach((input, index) => {
    input.addEventListener('input', (e) => {
      if (e.target.value.length === 1 && index < locInputs.length - 1) {
        locInputs[index + 1].focus();
      }
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
        locInputs[index - 1].focus();
      }
    });
  });

  function generateLabel() {
    const areaCode = document.getElementById('area-code').value.trim().toUpperCase();
    const locDigits = locInputs.map(i => i.value.trim().toUpperCase()).join('');
    const sideId = document.getElementById('side-id').value.trim().toUpperCase();

    if (!areaCode || locDigits.length < 4 || !sideId) {
      alert("Please fill in all input boxes properly.");
      return;
    }

    // Build base location code (e.g., DSCA0200AF)
    const baseCode = `${areaCode}${locDigits}${sideId}`;
    
    // Parse location header display text (e.g., C-02 or A-02)
    const letter = locDigits.charAt(0).match(/[A-Z]/) ? locDigits.charAt(0) : areaCode.slice(-1);
    const bayNum = locDigits.slice(-2);
    const locHeaderText = `${letter}-${bayNum}`;

    const levels = [
      { code: '00', color: 'color-white' },
      { code: '10', color: 'color-pink' },
      { code: '20', color: 'color-green' },
      { code: '30', color: 'color-yellow' },
      { code: '40', color: 'color-blue' }
    ];

    const previewStage = document.getElementById('preview-stage');
    previewStage.innerHTML = '';

    const isHorizontal = selectedLayoutMode === 'back';
    const containerClass = isHorizontal ? 'label-container-horizontal' : 'label-container-vertical';

    const container = document.createElement('div');
    container.className = containerClass;

    levels.forEach(lvl => {
      const fullBarcode = `${areaCode}${locDigits.slice(0, 2)}${lvl.code}${sideId}`;
      const block = document.createElement('div');
      block.className = 'level-block';

      block.innerHTML = `
        <div class="barcode-wrapper">
          <svg class="barcode-svg" id="barcode-${lvl.code}"></svg>
        </div>
        <div class="text-row ${lvl.color}">
          <span class="level-text">${lvl.code}-${sideId}</span>
          <span class="check-digit">00</span>
        </div>
      `;
      container.appendChild(block);
    });

    // Append base location header
    const headerBlock = document.createElement('div');
    headerBlock.className = 'location-header';
    headerBlock.innerHTML = `<div class="loc-text">${locHeaderText}</div>`;
    container.appendChild(headerBlock);

    previewStage.appendChild(container);

    // Render Barcodes via JsBarcode
    const barcodeOptions = {
      format: "CODE128",
      lineColor: "#000000",
      width: isHorizontal ? 1.25 : 1.1,
      height: isHorizontal ? 48 : 40,
      displayValue: true,
      fontSize: 10,
      fontOptions: "bold",
      font: "monospace",
      textMargin: 2,
      margin: 0
    };

    levels.forEach(lvl => {
      const fullBarcode = `${areaCode}${locDigits.slice(0, 2)}${lvl.code}${sideId}`;
      JsBarcode(`#barcode-${lvl.code}`, fullBarcode, barcodeOptions);
    });
  }

  // Generate default on initial load
  window.onload = generateLabel;
</script>

</body>
</html>
